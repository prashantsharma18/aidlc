  scans:
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: The framework reference is set and pinned (fails closed)
        env: {REPO: "${{ vars.AIDLC_FRAMEWORK_REPO }}", REF: "${{ vars.AIDLC_FRAMEWORK_REF }}"}
