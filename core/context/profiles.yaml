# Framework data: default commands per repository profile. A repository
# edits its own .aidlc/config.yaml afterwards. Commands must be deterministic and non-interactive.
node:
  commands:
    install: npm ci
    lint: npm run lint
    typecheck: npm run typecheck
    test: npm test
    build: npm run build
  check_steps: [lint, typecheck, test]
  test_reports: [".check/test-report.json"]
  network_allow: [registry.npmjs.org]
  sandbox_allow_write: ["~/.npm"]
  ci_sandbox_read: ["~/.nvm"]
  ci_sandbox_env: [NVM_DIR]
dotnet:
  commands:
    restore: dotnet restore --locked-mode
    # In-process MSBuild, no git queries, whitespace-only format: Claude Code's sandbox refuses MSBuild's
    # node pipes and replaces .gitmodules with an unreadable placeholder (Plan 6 demo, finding F9).
    # Style and analyzer checks in dotnet format need that host, so format checks whitespace only.
    # Analyzer warnings still fail the build (-warnaserror); IDE code-style rules do so only with
    # EnforceCodeStyleInBuild=true in Directory.Build.props, so set it, or run full dotnet format in CI.
    build: dotnet build --nologo --no-restore -warnaserror -m:1 -nodeReuse:false --disable-build-servers -p:EnableSourceControlManagerQueries=false
    format: dotnet format whitespace --folder --verify-no-changes
    test: dotnet test --nologo --no-build -m:1 --disable-build-servers --logger "trx;LogFilePrefix=results" --results-directory .check/trx
  check_steps: [build, format, test]
  test_reports: [".check/trx/*.trx"]
  network_allow: [api.nuget.org, globalcdn.nuget.org]
  sandbox_allow_write: ["~/.nuget/packages", "~/.local/share/NuGet", "~/.dotnet"]
  ci_sandbox_read: ["~/.dotnet"]
  ci_sandbox_env: [DOTNET_ROOT, DOTNET_CLI_TELEMETRY_OPTOUT]
generic:
  commands: {}
  check_steps: []
  test_reports: []
  network_allow: []
  sandbox_allow_write: []
  ci_sandbox_read: []
  ci_sandbox_env: []
