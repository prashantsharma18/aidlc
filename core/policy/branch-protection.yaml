meta: {id: policy-branch-protection, owner: "@platform-team", review_by: "2027-04-18", guide: ["11.8", "9.7", "14.16"]}
branch: main
require_pull_request: true
required_checks: [compile, check, scans, agent-config-evals, ai-review-dispositioned]
require_branch_up_to_date: true
approvals:
  required: 1
  from_code_owners: true
  excluded_identities: [pr_author, commit_pushers]
  dismiss_on_new_commits: true
# CODEOWNERS must cover these, with required code-owner review: the workflow, the harness, and the
# evidence trusted CI reads from the base branch (approvals, declared skips, exceptions). Merge approval
# is GitHub's own pull-request rule (ADR 0002).
code_owned_paths: ["/.github/", "/.aidlc/", "/plans/approved-bundles.txt",
                   "/test/allowed-skips.txt", "/test/protected-exceptions.txt"]
require_resolved_comments: true
bypass_allowed_for: []
allow_force_push: false
allow_deletion: false
