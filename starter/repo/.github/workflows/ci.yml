# The repository's checks on every pull request. Replace the two commands with the ones AGENTS.md names.
# Make "checks" and "slice-check" required checks in branch protection (GitHub Free: public repositories only).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      # Set up your language here, for example actions/setup-node or actions/setup-dotnet, pinned to a commit.
      - name: Lint
        run: echo "replace with your lint command" && exit 1
      - name: Tests
        run: echo "replace with your test command" && exit 1
  # The story's rules, checked by code (aidlc ADR 0019): scope, tests, manifests, suppressions, approved documents.
  # It runs the base branch's copy of the script on the pull request's own head commit, so a pull request cannot
  # weaken the script, and a merge commit adds nothing to check. This workflow runs from the pull request, so an
  # edit to it is held by CODEOWNERS (.github/ is the leads') and a required code-owner review, not by this job.
  # The pull request's own copy runs only when the base branch has no script yet (the pull request that adds it).
  slice-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Slice check, from the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/aidlc"
          if git cat-file -e "origin/$BASE_REF:scripts/check_slice.py" 2>/dev/null; then
            git show "origin/$BASE_REF:scripts/check_slice.py" > "$RUNNER_TEMP/aidlc/check_slice.py"
          else
            cp scripts/check_slice.py "$RUNNER_TEMP/aidlc/check_slice.py"
          fi
          python3 "$RUNNER_TEMP/aidlc/check_slice.py" --base "origin/$BASE_REF" --branch "$HEAD_REF"
  # A consumer's vendored contracts (contracts/<provider>/) match their SOURCE: the published tag, its commit and the
  # copy's sha256 (aidlc ADR 0022). Offline, so the check never needs the provider. A repository with no contracts/
  # passes. Make "contract-pin" a required check where the repository consumes a contract. Like slice-check, it runs
  # the base branch's copy of the scripts on a pull request, so a pull request cannot rewrite the check and the
  # vendored contract together; the tree's own copy runs on a push only. A pull request whose base has no check skips it.
  contract-pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Vendored contracts match their SOURCE
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The base branch decides whether a check exists, never the pull request's own tree.
            if git cat-file -e "origin/$BASE_REF:scripts/check_contract_pin.py" 2>/dev/null; then
              mkdir -p "$RUNNER_TEMP/aidlc"
              git show "origin/$BASE_REF:scripts/check_contract_pin.py" > "$RUNNER_TEMP/aidlc/check_contract_pin.py"
              git show "origin/$BASE_REF:scripts/check_contract_version.py" > "$RUNNER_TEMP/aidlc/check_contract_version.py"
              python3 "$RUNNER_TEMP/aidlc/check_contract_pin.py"
            else
              echo "no contract pin check in this repository"
            fi
          elif [ -f scripts/check_contract_pin.py ]; then
            python3 scripts/check_contract_pin.py
          else
            echo "no contract pin check in this repository"
          fi
